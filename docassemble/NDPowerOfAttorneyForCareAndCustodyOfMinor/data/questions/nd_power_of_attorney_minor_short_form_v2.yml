---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the
# same template is used for "preview" and "final" keys, and logic in the template checks
# the value of `i` to show or hide the user's signature
attachment:
  name: nd power of attorney minor short form v2
  filename: nd_power_of_attorney_minor_short_form_v2
  variable name: nd_power_of_attorney_minor_short_form_v2_attachment[i]
  skip undefined: True
  pdf template file: ND_Power_of_Attorney_Minor_Short_Form_v2.pdf
  editable: false
  fields:
      - "users1_name_full": ${ users[0] }
      - "users1_name_full__1": ${ users[0] }
      #- "users1_name_full__2": ${ users[0] }
      - "users1_name__1": ${ users[0] }
      - "users1_is_parent": ${ users1_is_parent }
      - "users1_is_legal_guardian": ${ users1_is_legal_guardian }
      - "children1_name": ${ children[0] }
      - "children1_birthdate": ${ format_date(children[0].birthdate, format='MMM d, yyyy') }
      - "children2_name": ${ children[1] }
      - "children2_birthdate": ${ format_date(children[1].birthdate, format='MMM d, yyyy') }
      - "children3_name": ${ children[2] }
      - "children3_birthdate": ${ format_date(children[2].birthdate, format='MMM d, yyyy') }
      - "users1_address_line_one": ${ users[0].address.line_one() }
      - "users1_address_line_two": ${ users[0].address.line_two() }
      - "attorney_in_fact_name": ${ attorney_in_fact[0] }
      - "attorney_in_fact_address_line_one": ${ attorney_in_fact[0].address.line_one() }
      - "attorney_in_fact_address_line_two": ${ attorney_in_fact[0].address.line_two() }
      - "delegate_all_powers_yes": ${ delegate_all_powers_yes }
      - "delegate_specific_authority_yes": ${ delegate_specific_authority_yes }
      #- "specific_authority": ${ ", ".join([p for p in specific_authority.true_values() if p != 'other'] + ([specific_authority_other] if specific_authority['other'] else [])) }
      - "specific_authority": ${ (", ".join([p for p in specific_authority.true_values() if p != 'other'] + ([specific_authority_other] if specific_authority['other'] else []))) if delegate_specific_authority_yes else "" }
      - "users1_end_date": ${ users1_end_date.format() }
      - "signature_date": ${ signature_date.format() }
      #- "signature_date": ${ signature_date.format() if with_notary_now else []}
      - "users1_signature": ${ users[0].signature_if_final(i) }
      - "users1_address_on_one_line": ${ users[0].address.on_one_line() }
      - "users1_phone_number": ${ phone_number_formatted(users[0].phone_number) }
      - "users1_email_address": ${ users1_email_address }
      - "users1_name_full__2": ${ users[0].name.full() + (", " + notary_county + ", North Dakota" if defined('with_notary_now') and with_notary_now and defined('notary_county') else "") }
      - "notary_date": ${ notary_date.format() }
      - "notary_signature": ${ notary[0].signature_if_final(i) }
      - "notary_commission_expiration_date": ${ notary_commission_expiration_date.format() }
