id: ND Power of Attorney Minor Short Form v2 intro
continue button field: nd_power_of_attorney_minor_short_form_v2_intro
question: "North Dakota power of attorney for care and custody of minor child(ren)"
subquestion: |2
  A power of attorney names another person to step into your shoes and make decisions for your child(ren). This person is called the attorney-in-fact.
  
  You can use this form if you are a parent or legal guardian. You may delegate any or all of your parental powers, except the power to consent to marriage or adoption.
  
  A power of attorney lasts for six months or less. If you need to delegate your power for longer than six months, you might need a [guardianship](https://www.ndcourts.gov/legal-self-help/minor-guardianship).
  
  ### Before you get started
  - You will need your child(ren)'s names and birth dates.
  - You will need the name and address of the person you choose to care for your child(ren).
  - Make sure the person you choose is age 18 or older.
  
  ### When you are finished
  - Sign the form in front of a notary public or clerk of court to make it official.
  - Give copies to the person you have chosen and keep one for your records.
---
id: prelim questions
question: |2
  Before you start
subquestion: |
  Let's make sure this is the right form for you.
fields:
  - note: |
      Contact your child's school, medical provider, or day care to see if they will accept a power of attorney. This form is a power of attorney. Some places will not accept this form.
      
  - "Will your child's school or provider accept a power of attorney form?": power_of_attorney_accepted
    datatype: yesnoradio
  - label: For how long do you want to delegate your power?
    field: delegate_length
    datatype: radio
    choices:
      - Six months or less
      - Longer than six months
    show if: power_of_attorney_accepted
---
id: exit guardianship
event: exit_guardianship
question: This is not the right form for you.
subquestion: |2
  You might need a different form if:
  
  * Your child's school or provider does not accept a power of attorney
  
  * You want to delegate your power for more than six months
  
  * To learn more, visit the North Dakota courts web page on [minor guardianships](https://www.ndcourts.gov/legal-self-help/minor-guardianship).
buttons:
  - Exit: exit
    url: https://www.ndcourts.gov/legal-self-help
---
id: attorney_in_fact_age_check
question: "Age of caretaker"
fields:
  - How old is the person you will choose to care for your child(ren)?: attorney_in_fact_age
    datatype: radio
    choices:
      - "18 or older"
      - Under 18
---
code: |
  delegate_length
  if delegate_length == "Longer than six months":
    exit_guardianship
---
id: exit attorney in fact under 18
question: "You will need to choose someone else"
subquestion: "The caretaker must be age 18 or older. If you want to choose someone else, click undo. If you cannot choose someone over 18, click exit."
buttons:
  - Exit: exit
event: attorney_in_fact_age_warning
---
id: User s Name
question: |2
  Your name
subquestion: |2+
  
fields:
  - What is your name?: users1_name_full
---
id: Guardian Information
question: |
  Guardian Information
subquestion: |2
  What is your relationship to the children?
fields:
  - "I am a parent": users1_is_parent
    datatype: yesno
    uncheck others:
      - users1_is_legal_guardian
  - "I am a legal guardian": users1_is_legal_guardian
    datatype: yesno
    uncheck others:
      - users1_is_parent
---
id: User s Address
question: |2
  Your Address
subquestion: |2+
  
fields:
  - What is your address?: users1_address
---
id: Powers To Delegate
question: |2
  Choose which powers to delegate
subquestion: |2
  Would you like to delegate all the powers that you have as a parent or guardian?
fields:
  - "Yes, delegate all powers.": delegate_all_powers_yes
    datatype: yesno
    uncheck others:
      - delegate_specific_authority_yes
  - "No, I need to choose specific powers.": delegate_specific_authority_yes
    datatype: yesno
    uncheck others:
      - delegate_all_powers_yes
  - label: "Choose the powers you want to delegate:"
    field: specific_authority
    datatype: checkboxes
    choices:
      - Education decisions
      - Consent for activities
      - Health care decisions
      - Power to sign other documents
      - "Other (fill in below):": other
    none of the above: false
    show if: delegate_specific_authority_yes
  - label: "Describe the power you want to delegate:"
    field: specific_authority_other
    input type: area
    show if: "specific_authority['other']"
---
id: Authority Duration
question: |2
  Length of time to delegate
subquestion: |2+
  
fields:
  - label: "Choose the end date for your delegation of power:"
    field: users1_end_date
    datatype: date
    help: Must be within 6 months.
    min: "${ today().year }"
    max: "${ today().plus(months=6) }"
---
id: Contact Information
question: |2
  Email contact
subquestion: |2+
  
fields:
  - What is your email address?: users1_email_address
---
id: Notary Information
question: |2
